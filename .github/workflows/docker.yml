name: Docker

on:
  pull_request:
    paths:
      - '.docker/**'
      - 'docker-compose.yml'
      - 'composer.json'
      - 'package.json'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - '.docker/**'
      - 'docker-compose.yml'
      - 'composer.json'
      - 'package.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file .docker/php/Dockerfile --tag e-cidade-site:test .

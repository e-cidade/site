name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          test -n "$pr_number"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: build_preview/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          source-dir: ./build_preview/
          pr-number: ${{ steps.pr.outputs.number }}
          preview-branch: gh-pages
          pages-base-url: site-ecidade.librecode.coop
          wait-for-pages-deployment: false

  remove:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}
          preview-branch: gh-pages
          pages-base-url: site-ecidade.librecode.coop
          wait-for-pages-deployment: false
          comment: false

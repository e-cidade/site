name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: site-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          test -n "$pr_number"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          name: preview-build
          path: build_preview/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy PR preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          source-dir: ./build_preview/
          pr-number: ${{ steps.pr.outputs.number }}
          preview-branch: gh-pages
          pages-base-url: site-ecidade.librecode.coop
          wait-for-pages-deployment: false
          comment: false
          deploy-commit-message: Deploy preview for PR ${{ steps.pr.outputs.number }} 🛫

      - name: Publish preview link on PR
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: pr-preview
          message: |
            ## PR preview

            Preview disponível em: ${{ steps.preview.outputs.preview-url }}

            O preview é atualizado a cada push no PR e removido quando o PR é fechado.

  remove:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}
          preview-branch: gh-pages
          pages-base-url: site-ecidade.librecode.coop
          wait-for-pages-deployment: false
          comment: false

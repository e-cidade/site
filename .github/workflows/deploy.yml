name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
      - name: Restore Composer dependencies
        id: composer-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            vendor-bin/phpunit/vendor
            vendor-bin/php-cs-fixer/vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.json', 'composer.lock', 'vendor-bin/**/composer.json', 'vendor-bin/**/composer.lock') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Node dependencies
        id: node-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
        if: steps.composer-deps.outputs.cache-hit != 'true'
      - run: composer dump-autoload --no-interaction --optimize
      - run: npm ci --no-audit --no-fund
        if: steps.node-deps.outputs.cache-hit != 'true'
      - run: composer build
      - run: composer test:build
      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build_production
          clean-exclude: pr-preview
          force: false

      - name: Resolve published news
        if: github.event_name == 'push'
        id: news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.head.ref | startswith("content/news-"))][0].number // empty')"
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.head.ref | startswith("content/news-"))][0].head.ref // empty')"

          if [ -z "$pr_number" ] || [ -z "$head_ref" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_number="${head_ref#content/news-}"
          publication_url="$(php scripts/resolve-news-publication.php "$issue_number")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=https://github.com/$GITHUB_REPOSITORY/pull/$pr_number" >> "$GITHUB_OUTPUT"
          echo "publication_url=$publication_url" >> "$GITHUB_OUTPUT"

      - name: Mark published news
        if: steps.news.outputs.found == 'true'
        uses: ./.github/actions/news-state
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.news.outputs.issue }}
          state: published

      - name: Report published news
        if: steps.news.outputs.found == 'true'
        uses: ./.github/actions/news-status
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.news.outputs.issue }}
          status: Publicada
          detail: A notícia foi aprovada, incorporada ao site e publicada com sucesso.
          pr-url: ${{ steps.news.outputs.pr_url }}
          publication-url: ${{ steps.news.outputs.publication_url }}

      - name: Close published news issue
        if: steps.news.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.news.outputs.issue }}
        run: |
          state="$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')"
          if [ "$state" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
      - name: Restore Composer dependencies
        id: composer-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            vendor-bin/phpunit/vendor
            vendor-bin/php-cs-fixer/vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.json', 'composer.lock', 'vendor-bin/**/composer.json', 'vendor-bin/**/composer.lock') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Node dependencies
        id: node-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
        if: steps.composer-deps.outputs.cache-hit != 'true'
      - run: composer dump-autoload --no-interaction --optimize
      - run: npm ci --no-audit --no-fund
        if: steps.node-deps.outputs.cache-hit != 'true'
      - run: composer build
      - run: composer test:build
      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build_production
          clean-exclude: pr-preview
          force: false

      - name: Finalize published news issue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"             --jq '[.[] | select(.head.ref | startswith("content/news-"))][0].number // empty')"
          head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"             --jq '[.[] | select(.head.ref | startswith("content/news-"))][0].head.ref // empty')"

          if [ -z "$pr_number" ] || [ -z "$head_ref" ]; then
            echo "No news editorial pull request associated with this deployment."
            exit 0
          fi

          issue_number="${head_ref#content/news-}"
          publication_url="$(php scripts/resolve-news-publication.php "$issue_number")"
          marker="<!-- e-cidade-news-publication:${GITHUB_SHA} -->"
          pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}"

          if ! gh issue view "$issue_number" --json comments --jq '.comments[].body' | grep -Fq "$marker"; then
            gh issue comment "$issue_number" --body "$marker
          ✅ Notícia publicada com sucesso.

          URL: $publication_url
          Pull Request: $pr_url
          Commit publicado: \`${GITHUB_SHA}\`"
          fi

          state="$(gh issue view "$issue_number" --json state --jq '.state')"
          if [ "$state" = "OPEN" ]; then
            gh issue close "$issue_number" --reason completed
          fi

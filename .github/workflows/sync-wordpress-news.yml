name: Import WordPress news into Issues

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: import-wordpress-news
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Export public WordPress posts
        env:
          WORDPRESS_SOURCE_URL: https://ecidade.softwarepublico.org
        run: php scripts/export-wordpress-news-issues.php > "$RUNNER_TEMP/wordpress-news.json"

      - name: Create or update editorial Issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.[]' "$RUNNER_TEMP/wordpress-news.json" | while IFS= read -r record; do
            wp_id="$(jq -r '.wordpress_id' <<< "$record")"
            title="$(jq -r '.title' <<< "$record")"
            desired_hash="$(jq -r '.hash' <<< "$record")"
            body_file="$RUNNER_TEMP/wordpress-${wp_id}.md"
            jq -r '.body' <<< "$record" > "$body_file"

            issues_json="$RUNNER_TEMP/issues.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$issues_json"

            issue_number="$(jq -r --arg marker "<!-- e-cidade-wordpress-id:${wp_id} -->"               '[.[][] | select(.pull_request == null) | select((.body // "") | contains($marker))][0].number // empty'               "$issues_json")"

            if [ -z "$issue_number" ]; then
              issue_number="$(jq -r --arg title "$title"                 '[.[][] | select(.pull_request == null) | select(.title == $title) | select((.body // "") | contains("<!-- e-cidade-migrated-post:"))][0].number // empty'                 "$issues_json")"
            fi

            if [ -n "$issue_number" ]; then
              current_json="$(gh issue view "$issue_number" --json body,state,title)"
              current_body="$(jq -r '.body' <<< "$current_json")"
              current_hash="$(sed -n 's/.*e-cidade-wordpress-hash:\([a-f0-9]*\).*/\1/p' <<< "$current_body" | head -n 1)"

              if [ -z "$current_hash" ] && grep -Fq '<!-- e-cidade-migrated-post:' <<< "$current_body"; then
                {
                  printf '<!-- e-cidade-wordpress-id:%s -->\n' "$wp_id"
                  printf '<!-- e-cidade-wordpress-hash:%s -->\n' "$desired_hash"
                  printf '%s\n' "$current_body"
                } > "$body_file"
                gh issue edit "$issue_number" --body-file "$body_file"
                echo "Mapped historical issue #$issue_number to WordPress post $wp_id without republishing."
                continue
              fi

              if [ "$current_hash" = "$desired_hash" ] && [ "$(jq -r '.title' <<< "$current_json")" = "$title" ]; then
                echo "WordPress post $wp_id already matches issue #$issue_number."
                continue
              fi

              gh issue edit "$issue_number" --title "$title" --body-file "$body_file"
              if [ "$(jq -r '.state' <<< "$current_json")" = "CLOSED" ]; then
                gh issue reopen "$issue_number"
              fi
            else
              issue_url="$(gh issue create --title "$title" --body-file "$body_file")"
              issue_number="${issue_url##*/}"
            fi

            gh workflow run sync-news-issue.yml -f issue_number="$issue_number"
            echo "Queued editorial synchronization for WordPress post $wp_id via issue #$issue_number."
          done

name: Sync news issue

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to synchronize
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: news-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Resolve issue payload
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$DISPATCH_ISSUE_NUMBER"
            event_path="$RUNNER_TEMP/news-issue-event.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" > "$RUNNER_TEMP/news-issue.json"
            jq -n --slurpfile issue "$RUNNER_TEMP/news-issue.json" '{issue: $issue[0]}' > "$event_path"
          else
            issue_number="${{ github.event.issue.number }}"
            event_path="$GITHUB_EVENT_PATH"
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "event_path=$event_path" >> "$GITHUB_OUTPUT"

      - name: Detect editorial issue
        id: editorial
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          EVENT_PATH: ${{ steps.issue.outputs.event_path }}
        run: |
          set -eu
          is_news=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            is_news=true
          else
            body="$(jq -r '.issue.body // ""' "$EVENT_PATH")"
            if printf '%s' "$body" | grep -Fq '### Resumo' &&
               printf '%s' "$body" | grep -Fq '### Data da publicação' &&
               printf '%s' "$body" | grep -Fq '### Texto da notícia'; then
              is_news=true
            else
              branch="content/news-${ISSUE_NUMBER}"
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                is_news=true
              elif [ "$(gh pr list --head "$branch" --state all --json number --jq 'length')" -gt 0 ]; then
                is_news=true
              fi
            fi
          fi

          echo "is_news=$is_news" >> "$GITHUB_OUTPUT"

      - name: Resolve editorial branch
        if: steps.editorial.outputs.is_news == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          branch="content/news-${ISSUE_NUMBER}"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git fetch origin main
            git checkout -B "$branch" origin/main
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Sync issue into Markdown
        if: steps.editorial.outputs.is_news == 'true'
        id: sync
        env:
          NEWS_ISSUE: "true"
        run: php scripts/sync-news-issue.php "${{ steps.issue.outputs.event_path }}" >> "$GITHUB_OUTPUT"

      - name: Commit generated content
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid == 'true' && steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts source/assets/images/news
          git commit --signoff -m "content: sync news issue #${ISSUE_NUMBER}"
          git push --force-with-lease -u origin "$BRANCH"

      - name: Create draft pull request
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid == 'true' && steps.branch.outputs.pr_number == '' && steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          pr_url="$(gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "content: publish news from issue #${ISSUE_NUMBER}" \
            --body "Generated automatically from #${ISSUE_NUMBER}. The Issue is the editorial source; this PR is the reviewable publication snapshot.")"
          gh issue comment "$ISSUE_NUMBER" \
            --body "Prévia editorial criada em $pr_url. Alterações nesta notícia atualizarão automaticamente o mesmo Pull Request enquanto ele estiver aberto."

      - name: Report invalid news issue
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          VALIDATION_ERROR: ${{ steps.sync.outputs.validation_error }}
        run: |
          set -eu
          hash="$(printf '%s' "$VALIDATION_ERROR" | sha256sum | cut -d' ' -f1)"
          marker="<!-- e-cidade-news-validation-error:$hash -->"

          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[].body' | grep -Fq "$marker"; then
            gh issue comment "$ISSUE_NUMBER" --body "$marker
          Não foi possível atualizar a prévia desta notícia porque a Issue está inválida.

          **Erro:** $VALIDATION_ERROR

          Corrija os campos da Issue mantendo os títulos das seções gerados pelo formulário. Assim que a Issue for salva novamente, a prévia será atualizada automaticamente."
          fi

          echo "::error::$VALIDATION_ERROR"
          exit 1

      - name: Report unchanged content
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid == 'true' && steps.sync.outputs.changed != 'true'
        run: echo "Issue content already matches the generated publication snapshot."

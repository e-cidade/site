name: Sync news issue

on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to synchronize
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: news-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve issue payload
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$DISPATCH_ISSUE_NUMBER"
            event_path="$RUNNER_TEMP/news-issue-event.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" > "$RUNNER_TEMP/news-issue.json"
            jq -n --slurpfile issue "$RUNNER_TEMP/news-issue.json" '{issue: $issue[0]}' > "$event_path"
            action="dispatch"
          else
            issue_number="${{ github.event.issue.number }}"
            event_path="$GITHUB_EVENT_PATH"
            action="${{ github.event.action }}"
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "event_path=$event_path" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Detect editorial issue
        id: editorial
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          EVENT_PATH: ${{ steps.issue.outputs.event_path }}
        run: |
          set -eu
          is_news=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            is_news=true
          elif jq -e '.issue.labels[]? | select(.name == "editorial/news")' "$EVENT_PATH" >/dev/null; then
            is_news=true
          else
            body="$(jq -r '.issue.body // ""' "$EVENT_PATH")"
            if printf '%s' "$body" | grep -Fq '### Resumo' &&
               { printf '%s' "$body" | grep -Fq '### Data da notícia' || printf '%s' "$body" | grep -Fq '### Data da publicação'; } &&
               printf '%s' "$body" | grep -Fq '### Texto da notícia'; then
              is_news=true
            else
              branch="content/news-${ISSUE_NUMBER}"
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                is_news=true
              elif [ "$(gh pr list --head "$branch" --state all --json number --jq 'length')" -gt 0 ]; then
                is_news=true
              fi
            fi
          fi

          echo "is_news=$is_news" >> "$GITHUB_OUTPUT"

      - name: Resolve closed editorial cycle
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action == 'closed'
        id: closed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          branch="content/news-${ISSUE_NUMBER}"
          if grep -R -Eq "^github_issue:[[:space:]]*${ISSUE_NUMBER}[[:space:]]*$" source/_posts; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "Ciclo editorial encerrado porque a Issue de origem foi fechada antes da publicação."
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi

          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Mark discarded news
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action == 'closed' && steps.closed.outputs.published != 'true'
        uses: ./.github/actions/news-state
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          state: discarded

      - name: Report discarded news
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action == 'closed' && steps.closed.outputs.published != 'true'
        uses: ./.github/actions/news-status
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          status: Descartada
          detail: A proposta foi encerrada antes da publicação. O Pull Request e a branch editorial pendentes foram encerrados quando existiam.

      - name: Keep published state on close
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action == 'closed' && steps.closed.outputs.published == 'true'
        uses: ./.github/actions/news-state
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          state: published

      - name: Resolve editorial branch
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action != 'closed'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          branch="content/news-${ISSUE_NUMBER}"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main "$branch"
            git checkout -B "$branch" "origin/$branch"
            git rebase origin/main
          else
            git fetch origin main
            git checkout -B "$branch" origin/main
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Sync issue into Markdown
        if: steps.editorial.outputs.is_news == 'true' && steps.issue.outputs.action != 'closed'
        id: sync
        env:
          NEWS_ISSUE: "true"
        run: php scripts/sync-news-issue.php "${{ steps.issue.outputs.event_path }}" >> "$GITHUB_OUTPUT"

      - name: Mark invalid news
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid != 'true'
        uses: ./.github/actions/news-state
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          state: invalid

      - name: Report invalid news issue
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid != 'true'
        uses: ./.github/actions/news-status
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          status: Ação necessária
          detail: ${{ steps.sync.outputs.validation_error }}

      - name: Fail invalid news issue
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid != 'true'
        env:
          VALIDATION_ERROR: ${{ steps.sync.outputs.validation_error }}
        run: |
          echo "::error::$VALIDATION_ERROR"
          exit 1

      - name: Commit generated content
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid == 'true' && steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts source/assets/images/news
          git commit --signoff -m "content: sync news issue #${ISSUE_NUMBER}"
          git push --force-with-lease -u origin "$BRANCH"

      - name: Ensure draft pull request
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.valid == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          set -eu
          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ] && [ "$CHANGED" = "true" ]; then
            pr_url="$(gh pr create               --draft               --base main               --head "$BRANCH"               --title "content: publish news from issue #${ISSUE_NUMBER}"               --body "Generated automatically from #${ISSUE_NUMBER}. The Issue is the editorial source; this PR is the reviewable publication snapshot.")"
            pr_number="${pr_url##*/}"
          fi

          if [ -n "$pr_number" ]; then
            pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "preview=https://site-ecidade.librecode.coop/pr-preview/pr-${pr_number}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark draft news
        if: steps.sync.outputs.valid == 'true' && steps.pr.outputs.number != ''
        uses: ./.github/actions/news-state
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          state: draft

      - name: Report synchronized news
        if: steps.sync.outputs.valid == 'true' && steps.pr.outputs.number != ''
        uses: ./.github/actions/news-status
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          status: Rascunho editorial
          detail: A notícia está sincronizada. Alterações nesta Issue atualizarão o mesmo Pull Request enquanto ele permanecer aberto.
          pr-url: ${{ steps.pr.outputs.url }}
          preview-url: ${{ steps.pr.outputs.preview }}

      - name: Report unchanged published content
        if: steps.sync.outputs.valid == 'true' && steps.pr.outputs.number == '' && steps.sync.outputs.changed != 'true'
        run: echo "Issue content already matches the published snapshot."

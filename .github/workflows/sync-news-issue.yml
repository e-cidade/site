name: Sync news issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: news-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.body || '', '### Resumo') &&
      contains(github.event.issue.body || '', '### Data da publicação') &&
      contains(github.event.issue.body || '', '### Texto da notícia')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve editorial branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          branch="content/news-${ISSUE_NUMBER}"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git fetch origin main
            git checkout -B "$branch" origin/main
          fi

          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Sync issue into Markdown
        id: sync
        run: php scripts/sync-news-issue.php "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit generated content
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts source/assets/images/news
          git commit --signoff -m "content: sync news issue #${ISSUE_NUMBER}"
          git push --force-with-lease -u origin "$BRANCH"

      - name: Create draft pull request
        if: steps.sync.outputs.is_news == 'true' && steps.branch.outputs.pr_number == '' && steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eu
          pr_url="$(gh pr create             --draft             --base main             --head "$BRANCH"             --title "content: publish news from issue #${ISSUE_NUMBER}"             --body "Generated automatically from #${ISSUE_NUMBER}. The Issue is the editorial source; this PR is the reviewable publication snapshot.")"

          gh issue comment "$ISSUE_NUMBER"             --body "Prévia editorial criada em $pr_url. Alterações nesta notícia atualizarão automaticamente o mesmo Pull Request enquanto ele estiver aberto."

      - name: Report unchanged content
        if: steps.sync.outputs.is_news == 'true' && steps.sync.outputs.changed != 'true'
        run: echo "Issue content already matches the generated publication snapshot."

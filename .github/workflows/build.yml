name: Build and smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: composer build
      - name: Smoke test generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -f build_production/index.html
          test -f build_production/sobre/index.html
          test -f build_production/noticias/index.html
          test -f build_production/codigo-fonte/index.html
          test -f build_production/manuais-e-documentacoes/index.html
          test -f build_production/prestadores-de-servico/index.html
          test -f build_production/aula-inaugural-do-e-cidade-faz-historia/index.html
          test -f build_production/assets/images/migrated/aula-inaugural.png
          ! grep -R "wp-content/uploads" source/_posts

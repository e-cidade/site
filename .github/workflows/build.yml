name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
      - name: Restore Composer dependencies
        id: composer-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            vendor-bin/phpunit/vendor
            vendor-bin/php-cs-fixer/vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.json', 'composer.lock', 'vendor-bin/**/composer.json', 'vendor-bin/**/composer.lock') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Restore Node dependencies
        id: node-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
        if: steps.composer-deps.outputs.cache-hit != 'true'
      - run: composer dump-autoload --no-interaction --optimize
      - run: npm ci --no-audit --no-fund
        if: steps.node-deps.outputs.cache-hit != 'true'
      - run: composer build
      - run: composer test:build

name: Stage PHP quality lockfiles

on:
  push:
    branches:
      - chore/modernize-project-infrastructure

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=vendor-bin/phpunit update --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=vendor-bin/php-cs-fixer update --no-interaction --no-progress --prefer-dist
      - name: Push generated lockfiles to temporary staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock vendor-bin/phpunit/composer.lock vendor-bin/php-cs-fixer/composer.lock
          git commit -s -m "chore: stage generated PHP quality lockfiles"
          git push origin HEAD:refs/heads/chore/quality-lockfile-staging --force

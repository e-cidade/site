name: Cleanup quality lockfile staging

on:
  push:
    branches:
      - chore/modernize-project-infrastructure

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Remove temporary staging branch
        run: git push origin --delete chore/quality-lockfile-staging || true

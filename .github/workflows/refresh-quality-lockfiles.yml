name: Refresh quality lockfiles

on:
  push:
    branches:
      - chore/modernize-project-infrastructure

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=vendor-bin/phpunit update --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=vendor-bin/php-cs-fixer update --no-interaction --no-progress --prefer-dist
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: quality-lockfiles
          path: |
            composer.lock
            vendor-bin/phpunit/composer.lock
            vendor-bin/php-cs-fixer/composer.lock
            package-lock.json
          retention-days: 1

name: Setup editorial repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/news.yml
      - .github/workflows/editorial-setup.yml
      - listeners/Editorial/EditorialLabels.php
      - listeners/Editorial/EditorialState.php
      - scripts/editorial/setup.php

permissions:
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision editorial labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/editorial/setup.php

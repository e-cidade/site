name: PR Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_BASE_URL: https://site-ecidade.librecode.coop/pr-preview/pr-${{ github.event.pull_request.number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --no-audit --no-fund
      - run: npm run preview
      - name: Test preview build
        env:
          SITE_BUILD_DIR: build_preview
          EXPECTED_BASE_URL: ${{ env.PREVIEW_BASE_URL }}
        run: composer test:build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: build_preview/
          retention-days: 1

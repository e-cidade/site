name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_BASE_URL: https://site-ecidade.librecode.coop/pr-preview/pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: github.event.action != 'closed'
        with:
          coverage: none

      - name: Restore Composer dependencies
        id: composer-deps
        if: github.event.action != 'closed'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            vendor-bin/phpunit/vendor
            vendor-bin/php-cs-fixer/vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.json', 'composer.lock', 'vendor-bin/**/composer.json', 'vendor-bin/**/composer.lock') }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event.action != 'closed'
        with:
          node-version-file: package.json
          cache: npm

      - name: Restore Node dependencies
        id: node-deps
        if: github.event.action != 'closed'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - run: composer install --no-interaction --no-progress --prefer-dist
        if: github.event.action != 'closed' && steps.composer-deps.outputs.cache-hit != 'true'

      - run: composer dump-autoload --no-interaction --optimize
        if: github.event.action != 'closed'

      - run: npm ci --no-audit --no-fund
        if: github.event.action != 'closed' && steps.node-deps.outputs.cache-hit != 'true'

      - run: npm run preview
        if: github.event.action != 'closed'

      - name: Test preview build
        if: github.event.action != 'closed'
        env:
          SITE_BUILD_DIR: build_preview
          EXPECTED_BASE_URL: ${{ env.PREVIEW_BASE_URL }}
        run: composer test:build

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: auto
          source-dir: ./build_preview/
          preview-branch: gh-pages
          pages-base-url: site-ecidade.librecode.coop
          wait-for-pages-deployment: false

      - name: Report editorial preview
        if: github.event.action != 'closed' && startsWith(github.event.pull_request.head.ref, 'content/news-')
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORIAL_PREVIEW_BASE_URL: https://site-ecidade.librecode.coop/pr-preview
        run: php scripts/editorial/preview.php "$GITHUB_EVENT_PATH"

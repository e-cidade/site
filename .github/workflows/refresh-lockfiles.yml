name: Refresh migration lockfiles

on:
  push:
    branches: [feat/migrate-wordpress-content]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore: refresh dependency lockfiles')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-wordpress-content
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh dependency lockfiles'
          git push origin HEAD:feat/migrate-wordpress-content

name: Import provider logos

on:
  push:
    branches:
      - fix/provider-logos
    paths:
      - '.github/workflows/import-provider-logos.yml'
      - 'source/_providers/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/provider-logos

      - name: Download provider logos
        run: |
          set -euo pipefail
          mkdir -p source/assets/images/providers
          curl --fail --location --retry 3 --output source/assets/images/providers/contass.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/01/unnamed.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/dbseller.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/01/LogoDBseller1.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/librecode.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/01/librecode.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/cpd-municipal.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/01/logocpd.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/navarro-tecnologia.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2026/03/logo.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/softcast.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/04/softcast.png'
          curl --fail --location --retry 3 --output source/assets/images/providers/cpu-house.jpg 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/07/cpu-tec-1.jpg'
          curl --fail --location --retry 3 --output source/assets/images/providers/cajutec.png 'https://ecidade.softwarepublico.org/wp-content/uploads/2025/06/cajutec-color.cb5c64a4-468x1024.png'

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git add source/assets/images/providers
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: import provider logos'
          git push

name: Publicar notícia
description: Envie uma notícia para revisão e publicação no site do e-Cidade.
labels:
  - editorial/news
  - editorial/draft
body:
  - type: markdown
    attributes:
      value: |
        Preencha os campos abaixo. Você não precisa conhecer Git, HTML ou Markdown.
        O texto pode ser escrito normalmente; recursos de formatação do editor do GitHub são opcionais.

  - type: input
    id: summary
    attributes:
      label: Resumo
      description: Explique em uma ou duas frases o que aconteceu e por que a notícia é relevante.
      placeholder: Município adota o e-Cidade para modernizar a gestão pública.
    validations:
      required: true

  - type: input
    id: published_at
    attributes:
      label: Data da notícia
      description: Data editorial da notícia. Use o formato AAAA-MM-DD. A publicação efetiva acontece após aprovação, merge e deploy.
      placeholder: "2026-10-07"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Autor
      description: Opcional. Se ficar vazio, será usado "Comunidade e-Cidade".
      placeholder: Comunidade e-Cidade

  - type: textarea
    id: content
    attributes:
      label: Texto da notícia
      description: Escreva o conteúdo normalmente. Você pode usar a barra de formatação do GitHub para links, listas, imagens e destaque.
      placeholder: |
        Primeiro parágrafo da notícia.

        Um novo parágrafo pode ser escrito deixando uma linha em branco.
    validations:
      required: true

  - type: upload
    id: cover
    attributes:
      label: Imagem de capa
      description: Opcional. Envie a imagem principal da notícia.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp"

  - type: input
    id: cover_alt
    attributes:
      label: Texto alternativo da imagem
      description: Se enviar uma imagem, descreva objetivamente o que ela mostra.
      placeholder: Participantes durante a capacitação do e-Cidade

  - type: input
    id: media_rights_holder
    attributes:
      label: Detentor dos direitos das imagens
      description: Obrigatório quando houver qualquer imagem na notícia. Informe a pessoa ou organização que detém os direitos.
      placeholder: Prefeitura de Exemplo

  - type: dropdown
    id: media_license
    attributes:
      label: Licença/permissão das imagens
      description: Obrigatório quando houver imagens. Escolha a licença aplicável ou a opção de permissão específica.
      options:
        - CC-BY-4.0
        - CC-BY-SA-4.0
        - CC0-1.0
        - LicenseRef-eCidade-Editorial-Permission

  - type: input
    id: media_credit
    attributes:
      label: Crédito das imagens
      description: Opcional. Texto de crédito que deve aparecer na publicação.
      placeholder: Foto: Prefeitura de Exemplo

  - type: checkboxes
    id: media_authorization
    attributes:
      label: Autorização para publicar as imagens
      description: Marque quando a notícia contiver qualquer imagem, inclusive imagens inseridas no corpo.
      options:
        - label: Confirmo que tenho autorização para enviar e permitir a publicação das imagens informadas nesta notícia.
          required: false

  - type: input
    id: source_label
    attributes:
      label: Fonte original
      description: Opcional. Informe o nome da fonte quando a notícia se basear em uma publicação externa.
      placeholder: Prefeitura de Exemplo

  - type: input
    id: source_url
    attributes:
      label: URL da fonte
      description: Opcional. Link completo da publicação original.
      placeholder: https://exemplo.gov.br/noticia

name: Update news editorial status
description: Upsert the single bot-managed editorial status comment on a news Issue.
inputs:
  issue-number:
    required: true
    description: GitHub Issue number.
  status:
    required: true
    description: Human-readable editorial status.
  detail:
    required: false
    default: ""
    description: Optional explanatory text.
  pr-url:
    required: false
    default: ""
    description: Editorial pull request URL.
  preview-url:
    required: false
    default: ""
    description: Preview URL.
  publication-url:
    required: false
    default: ""
    description: Published article URL.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        STATUS: ${{ inputs.status }}
        DETAIL: ${{ inputs.detail }}
        PR_URL: ${{ inputs.pr-url }}
        PREVIEW_URL: ${{ inputs.preview-url }}
        PUBLICATION_URL: ${{ inputs.publication-url }}
      run: |
        set -eu
        marker='<!-- e-cidade-editorial-status -->'
        body_file="$RUNNER_TEMP/e-cidade-news-status.md"

        {
          echo "$marker"
          echo "### Status editorial"
          echo
          echo "**$STATUS**"
          if [ -n "$DETAIL" ]; then
            echo
            printf '%s\n' "$DETAIL"
          fi
          if [ -n "$PR_URL" ]; then
            echo
            echo "Pull Request: $PR_URL"
          fi
          if [ -n "$PREVIEW_URL" ]; then
            echo "Prévia: $PREVIEW_URL"
          fi
          if [ -n "$PUBLICATION_URL" ]; then
            echo "Publicação: $PUBLICATION_URL"
          fi
          echo
          echo "_Este comentário é atualizado automaticamente pelo fluxo editorial._"
        } > "$body_file"

        comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- e-cidade-editorial-status -->")) | .id' | head -n 1)"
        body="$(cat "$body_file")"

        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
        else
          gh issue comment "$ISSUE_NUMBER" --body "$body" >/dev/null
        fi

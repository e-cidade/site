name: Set news editorial state
description: Ensure editorial labels exist and set the single current editorial state.
inputs:
  issue-number:
    required: true
    description: GitHub Issue number.
  state:
    required: true
    description: One of draft, invalid, review, ready, published or discarded.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        STATE: ${{ inputs.state }}
      run: |
        set -eu
        case "$STATE" in
          draft|invalid|review|ready|published|discarded) ;;
          *) echo "Unsupported editorial state: $STATE" >&2; exit 1 ;;
        esac

        while IFS='|' read -r name color description; do
          gh label create "$name" --color "$color" --description "$description" --force >/dev/null
        done <<'LABELS'
        editorial/news|0E8A16|Identifica Issues que pertencem ao fluxo editorial de notícias
        editorial/draft|D4C5F9|Notícia em rascunho editorial
        editorial/invalid|D73A4A|Notícia com dados editoriais inválidos
        editorial/review|FBCA04|Notícia aguardando revisão editorial
        editorial/ready|1D76DB|Notícia aprovada e pronta para publicação
        editorial/published|0E8A16|Notícia publicada
        editorial/discarded|6E7781|Proposta editorial descartada
        LABELS

        for state in draft invalid review ready published discarded; do
          if [ "$state" != "$STATE" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "editorial/$state" >/dev/null 2>&1 || true
          fi
        done

        gh issue edit "$ISSUE_NUMBER" --add-label editorial/news --add-label "editorial/$STATE" >/dev/null
